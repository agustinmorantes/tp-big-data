# Plan B local (R-8): Spark + Cassandra en Docker, sin depender de Colab ni de AstraDB.
# Desde la raíz del repo:
#   docker compose -f infra/docker-compose.yml up -d cassandra
#   docker compose -f infra/docker-compose.yml run --rm pipeline python -m cpa.run_pipeline all
services:
  cassandra:
    image: cassandra:4.1
    container_name: cpa-cassandra
    ports:
      - "9042:9042"
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20

  pipeline:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: cpa-pipeline:local
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      - CPA_SERVING_TARGET=cassandra
      - CASSANDRA_HOST=cassandra
    depends_on:
      cassandra:
        condition: service_healthy
